<template
  ><section class="card">
    <h2>Your payment status</h2>
    <p role="status">{message}</p>
    <p class="error" role="alert">{error}</p>
    <div class="actions">
      <button onclick={refresh} disabled={busy}>Refresh verification</button
      ><a href={checkoutUrl}>Return to checkout</a
      ><a href={shoppingUrl}>Continue shopping</a
      ><a href={historyUrl}>View my orders</a>
    </div>
  </section></template
>
