<template
  ><main class="shell">
    <p class="eyebrow">GOLDVUEE &middot; THOUGHTFULLY CHOSEN</p>
    <h1>A little closer to yours</h1>
    <template lwc:if={guest}
      ><section class="card">
        <p>Sign in to continue to checkout.</p>
        <a class="button" href={loginUrl}>Sign in</a>
      </section></template
    ><template lwc:else
      ><ol class="progress" aria-label="Checkout progress">
        <li class={addressClass}>1 &middot; Delivery</li>
        <li class={summaryClass}>2 &middot; Review</li>
        <li class={paymentClass}>3 &middot; Payment</li>
      </ol>
      <p role="alert" class="error">{error}</p>
      <p role="status">{notice}</p>
      <p lwc:if={monitoring} role="status">
        Verifying payment: {remainingSeconds} seconds remaining. You can
        continue shopping at any time.
      </p>
      <a href={shoppingUrl}>Continue shopping</a>
      <p lwc:if={busy} role="status">Please waitâ€¦</p>
      <template lwc:if={addressStep}
        ><section class="card">
          <h2>Where should we deliver?</h2>
          <div class="grid">
            <div>
              <label for="name">Full name</label
              ><input
                id="name"
                name="fullName"
                value={delivery.fullName}
                onchange={input}
                oninput={input}
                required
                maxlength="120"
                autocomplete="shipping name"
              />
            </div>
            <div>
              <label for="phone">Mobile number</label
              >
<input
  id="phone"
  name="phone"
  type="tel"
  maxlength="20"
  value={delivery.phone}
  onchange={input}
  oninput={input}
  required
  autocomplete="tel"
  title="Enter a valid Indian mobile number"
/>

              <p id="phone-help">10-digit Indian mobile; +91 is optional.</p>
            </div>
          </div>
          <label for="street">Street address</label
          ><textarea
            id="street"
            name="street"
            onchange={input}
            oninput={input}
            required
            maxlength="1000"
            autocomplete="shipping street-address"
          ></textarea>
          <div class="grid">
            <div>
              <label for="city">City</label
              ><input
                id="city"
                name="city"
                value={delivery.city}
                onchange={input}
                oninput={input}
                required
                maxlength="50"
                autocomplete="shipping address-level2"
              />
            </div>
            <div>
              <label for="state">State</label
              ><input
                id="state"
                name="state"
                type="text"
                value={delivery.state}
                onchange={input}
                oninput={input}
                required
                maxlength="50"
                autocomplete="shipping address-level1"
              />
            </div>
            <div>
              <label for="pin">PIN code</label
              ><input
                id="pin"
                name="postalCode"
                value={delivery.postalCode}
                onchange={input}
                oninput={input}
                required
                pattern="[1-9][0-9]{5}"
                maxlength="6"
                autocomplete="shipping postal-code"
              />
            </div>
            <div>
              <label for="country">Country</label
              ><input
                id="country"
                name="country"
                autocomplete="shipping country-name"
                value={delivery.country}
                onchange={input}
                oninput={input}
                required
                maxlength="50"
              />
            </div>
          </div>
          <div class="actions">
            <button onclick={review} disabled={busy}>
              Continue to order summary</button
            ><a href={cartUrl}>Back to bag</a>
          </div>
        </section></template
      >
      <template lwc:if={summaryStep}
        ><section class="card">
          <div class="row">
            <h2>Delivery address</h2>
            <button class="secondary" onclick={address}>Change address</button>
          </div>
          <p class="address">{snapshot}</p>
        </section>
        <section class="card">
          <h2>Your jewellery selection</h2>
          <template for:each={items} for:item="item"
            ><article class="product" key={item.id}>
              <img lwc:if={item.image} src={item.image} alt={item.name} />
              <div>
                <h2>{item.name}</h2>
                <p>Quantity: {item.quantity}</p>
              </div>
              <lightning-formatted-number
                value={item.total}
                format-style="currency"
                currency-code="INR"
              ></lightning-formatted-number></article
          ></template>
          <div class="row">
            <p>Grand total</p>
            <p class="amount">
              <lightning-formatted-number
                value={total}
                format-style="currency"
                currency-code="INR"
              ></lightning-formatted-number>
            </p>
          </div>
          <p class="muted">No additional checkout charges are configured.</p>
          <button onclick={paymentStepNext}>Continue to payment</button>
        </section></template
      >
      <template lwc:if={paymentStep}
        ><section class="card">
          <h2>Secure Razorpay test payment</h2>
          <button class="secondary" onclick={backToSummary}>
            Back to order summary
          </button>
          <p class="amount">
            <lightning-formatted-number
              value={total}
              format-style="currency"
              currency-code="INR"
            ></lightning-formatted-number>
          </p>
          <p role="status">{message}</p>
          <template lwc:if={showResult}
            ><c-gv-payment-result
              payment-id={paymentId}
            ></c-gv-payment-result></template
          ><template lwc:if={unpaid}
            ><div class="actions">
              <button onclick={pay} disabled={payDisabled}>
                Pay now &middot; Test mode</button
              ><button
                lwc:if={hasPaymentUrl}
                onclick={openPayment}
                disabled={busy}
              >
                Open secure Razorpay payment</button
              ><button class="secondary" onclick={refresh} disabled={busy}>
                Refresh payment status</button
              ><button class="secondary" onclick={cancel} disabled={busy}>
                Cancel unpaid payment</button
              ><button class="secondary" onclick={retry} disabled={busy}>
                Retry payment
              </button>
            </div>
            <p class="muted">
              Razorpay opens in a separate tab. This page checks verified
              payment status for two minutes. If payment is still pending, you
              can keep shopping while server verification continues.
            </p></template
          >
        </section></template
      ></template
    >
  </main></template
>
