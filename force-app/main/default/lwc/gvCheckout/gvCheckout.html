<template>
  <section class="checkout-page">
    <!-- HEADER -->
    <header class="checkout-header">
      <p class="eyebrow">THE GOLDVUEE EXPERIENCE</p>

      <h1>Secure Checkout</h1>

      <div class="gold-divider"></div>

      <p>Complete your order with confidence.</p>
    </header>

    <div class="checkout-container">
      <nav class="checkout-journey" aria-label="Checkout progress">
        <span>Shopping Bag</span><span aria-hidden="true">→</span>
        <span>Delivery Information</span><span aria-hidden="true">→</span>
        <span>Secure Payment</span><span aria-hidden="true">→</span>
        <span>Order Confirmation</span>
        <p class="current-step" aria-live="polite">
          Current step: {journeyLabel}
        </p>
      </nav>
      <template lwc:if={hasItems}>
        <template lwc:if={orderPlaced}></template>
        <template lwc:else>
          <button
            type="button"
            class="back-to-bag"
            onclick={handleBackToCart}
            disabled={isReturning}
          >
            {backButtonLabel}
          </button>
        </template>
      </template>
      <!-- LOADING -->
      <template lwc:if={isGuestUser}>
        <div class="empty-checkout">
          <h2>Sign in to Checkout</h2>
          <p>
            Sign in to your GoldVuee customer account to view your bag and pay
            securely.
          </p>
          <a href={loginUrl}>Sign in</a>
        </div>
      </template>
      <template lwc:elseif={isLoading}>
        <div class="status-message">Loading your checkout details...</div>
      </template>

      <template lwc:else>
        <!-- ERROR -->
        <template lwc:if={errorMessage}>
          <div class="message error-message" role="alert">{errorMessage}</div>
        </template>

        <!-- ORDER CONFIRMATION -->
        <template lwc:if={orderPlaced}>
          <div class="empty-checkout">
            <p class="section-eyebrow">ORDER CONFIRMED</p>

            <h2>Thank you for shopping at GoldVuee!</h2>

            <p class="message success-message" role="status">
              {successMessage}
            </p>

            <p>
              <strong>Order:</strong>
              {orderNumber}
            </p>

            <p>
              <strong>Grand Total:</strong>
              {formattedOrderGrandTotal}
            </p>

            <p>
              <strong>Order Status:</strong>
              {orderStatus}
            </p>

            <p>
              <strong>Payment:</strong>
              {confirmedPaymentMethod} ({paymentStatus})
            </p>

            <p>Your payment has been securely verified by Razorpay.</p>
          </div>
        </template>

        <template lwc:else>
          <template lwc:if={hasItems}>
            <div class="checkout-layout">
              <!-- LEFT COLUMN -->
              <div class="checkout-form-column">
                <!-- STEP 01: SHIPPING -->
                <div class="checkout-card">
                  <p class="section-eyebrow">STEP 01</p>

                  <h2>Delivery Information</h2>

                  <p class="section-description">
                    Where should we deliver your GoldVuee jewellery?
                  </p>

                  <div class="form-grid">
                    <!-- ADDRESS -->
                    <div class="form-field full-width">
                      <label for="shippingAddress"> Street Address * </label>

                      <textarea
                        id="shippingAddress"
                        name="shippingAddress"
                        autocomplete="street-address"
                        disabled={deliveryDisabled}
                        oninput={handleInputChange}
                        placeholder="House number, street, apartment"
                        required
                      >
                      </textarea>
                    </div>

                    <!-- CITY -->
                    <div class="form-field">
                      <label for="shippingCity"> City * </label>

                      <input
                        id="shippingCity"
                        type="text"
                        name="shippingCity"
                        autocomplete="address-level2"
                        maxlength="50"
                        disabled={deliveryDisabled}
                        value={shippingCity}
                        oninput={handleInputChange}
                        required
                      />
                    </div>

                    <!-- STATE -->
                    <div class="form-field">
                      <label for="shippingState"> State * </label>

                      <input
                        id="shippingState"
                        type="text"
                        name="shippingState"
                        autocomplete="address-level1"
                        maxlength="50"
                        disabled={deliveryDisabled}
                        value={shippingState}
                        oninput={handleInputChange}
                        required
                      />
                    </div>

                    <!-- PIN -->
                    <div class="form-field">
                      <label for="shippingPostalCode"> PIN Code * </label>

                      <input
                        id="shippingPostalCode"
                        type="text"
                        name="shippingPostalCode"
                        autocomplete="postal-code"
                        pattern="[1-9][0-9]{5}"
                        disabled={deliveryDisabled}
                        value={shippingPostalCode}
                        oninput={handleInputChange}
                        maxlength="6"
                        inputmode="numeric"
                        required
                      />
                    </div>

                    <!-- COUNTRY -->
                    <div class="form-field">
                      <label for="shippingCountry"> Country * </label>

                      <input
                        id="shippingCountry"
                        type="text"
                        name="shippingCountry"
                        autocomplete="country-name"
                        maxlength="100"
                        disabled={deliveryDisabled}
                        value={shippingCountry}
                        oninput={handleInputChange}
                        required
                      />
                    </div>
                  </div>
                </div>

                <!-- STEP 02: PAYMENT -->
                <div class="checkout-card">
                  <p class="section-eyebrow">STEP 02</p>

                  <h2>Payment Method</h2>

                  <p class="section-description">
                    Pay securely through the official Razorpay Test Mode
                    checkout.
                  </p>

                  <div class="payment-option razorpay-option">
                    <strong>Razorpay — Test Mode</strong>
                    <span> UPI, Cards, Net Banking and Wallets. </span>
                    <span> No real money is charged. </span>
                  </div>

                  <p class="payment-notice">
                    Your order is confirmed only after we verify the captured
                    payment.
                  </p>
                </div>
              </div>

              <!-- RIGHT COLUMN -->
              <aside class="checkout-summary">
                <div class="summary-card">
                  <p class="section-eyebrow">YOUR GOLDVUEE ORDER</p>

                  <h2>Order Summary</h2>

                  <!-- CART ITEMS -->
                  <template for:each={cartItems} for:item="item">
                    <div class="summary-item" key={item.id}>
                      <div class="summary-item-info">
                        <strong> {item.name} </strong>

                        <span> Qty: {item.quantity} </span>
                      </div>

                      <span class="item-price">
                        {item.formattedLineTotal}
                      </span>
                    </div>
                  </template>

                  <div class="summary-divider"></div>

                  <!-- ITEM COUNT -->
                  <div class="summary-row">
                    <span>Items</span>
                    <span>{itemCount}</span>
                  </div>

                  <!-- SUBTOTAL -->
                  <div class="summary-row">
                    <span>Subtotal</span>
                    <span>{formattedSubtotal}</span>
                  </div>

                  <!-- SHIPPING -->
                  <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                  </div>

                  <div class="summary-divider"></div>

                  <!-- TOTAL -->
                  <div class="summary-total">
                    <span>Order Total</span>

                    <strong> {formattedSubtotal} </strong>
                  </div>

                  <p class="summary-note">
                    Final total and stock availability are validated securely
                    before confirmation.
                  </p>

                  <!-- RAZORPAY PAYMENT PANEL -->
                  <c-goldvuee-razorpay-checkout
                    amount={subtotal}
                    shipping-address={shippingAddress}
                    shipping-city={shippingCity}
                    shipping-state={shippingState}
                    shipping-postal-code={shippingPostalCode}
                    shipping-country={shippingCountry}
                    oncheckoutstate={handleCheckoutState}
                    onpaymentsuccess={handleRazorpaySuccess}
                    oncheckoutcancelled={handleCheckoutCancelled}
                  >
                  </c-goldvuee-razorpay-checkout>

                  <p class="secure-note">✦ Secure GoldVuee Checkout</p>
                </div>
              </aside>
            </div>
          </template>

          <!-- EMPTY CART -->
          <template lwc:else>
            <div class="empty-checkout">
              <h2>Your Shopping Bag Is Empty</h2>

              <p>Add jewellery to your bag before proceeding to checkout.</p>

              <button type="button" onclick={handleBackToCart}>
                Return to Shopping Bag
              </button>
            </div>
          </template>
        </template>
      </template>
    </div>
  </section>
</template>
