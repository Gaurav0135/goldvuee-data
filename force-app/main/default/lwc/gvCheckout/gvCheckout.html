<template>
  <main class="shell">
    <p class="eyebrow">GOLDVUEE &middot; THOUGHTFULLY CHOSEN</p>
    <h1>A little closer to yours</h1>
    <a href={shoppingUrl}>Continue shopping</a>
    <template lwc:if={guest}
      ><section class="card">
        <h2>Your selection, safely yours</h2>
        <p>Sign in before checking out.</p>
        <a class="button" href={loginUrl}>Sign in</a>
      </section></template
    >
    <template lwc:else>
      <ol class="progress" aria-label="Checkout progress">
        <li class={addressClass}>1 &middot; Delivery</li>
        <li class={summaryClass}>2 &middot; Review</li>
        <li class={paymentClass}>3 &middot; Payment</li>
      </ol>
      <p class="error" role="alert">{error}</p>
      <p role="status">{notice}</p>
      <p lwc:if={busy} role="status">Please wait...</p>
      <template lwc:if={addressStep}>
        <section class="card">
          <h2>Where should we deliver?</h2>
          <div class="grid">
            <div>
              <label for="fullName">Full name</label
              ><input
                id="fullName"
                name="fullName"
                value={delivery.fullName}
                oninput={input}
                onchange={input}
                required
                maxlength="120"
                autocomplete="shipping name"
              />
            </div>
            <div>
              <label for="phone">Mobile number</label
              ><input
                id="phone"
                name="phone"
                type="tel"
                value={delivery.phone}
                pattern={phonePattern}
                oninput={input}
                onchange={input}
                required
                maxlength="40"
                autocomplete="shipping tel"
                aria-describedby="phoneHelp"
              />
              <p id="phoneHelp" class="muted">10 digits; +91 is optional.</p>
            </div>
          </div>
          <label for="street">Street address</label
          ><textarea
            id="street"
            name="street"
            oninput={input}
            onchange={input}
            required
            maxlength="1000"
            autocomplete="shipping street-address"
          ></textarea>
          <div class="grid">
            <div>
              <label for="city">City</label
              ><input
                id="city"
                name="city"
                value={delivery.city}
                oninput={input}
                onchange={input}
                required
                maxlength="50"
                autocomplete="shipping address-level2"
              />
            </div>
            <div>
              <label for="state">State</label
              ><input
                id="state"
                name="state"
                type="text"
                value={delivery.state}
                oninput={input}
                onchange={input}
                required
                maxlength="50"
                autocomplete="shipping address-level1"
              />
            </div>
            <div>
              <label for="pin">PIN code</label
              ><input
                id="pin"
                name="postalCode"
                value={delivery.postalCode}
                pattern="[1-9][0-9]{5}"
                oninput={input}
                onchange={input}
                required
                maxlength="6"
                autocomplete="shipping postal-code"
              />
            </div>
            <div>
              <label for="country">Country</label
              ><input
                id="country"
                name="country"
                value={delivery.country}
                oninput={input}
                onchange={input}
                required
                maxlength="50"
                autocomplete="shipping country-name"
              />
            </div>
          </div>
          <div class="actions">
            <button onclick={review} disabled={busy}>
              Continue to order summary</button
            ><a href={cartUrl}>Back to bag</a>
          </div>
        </section>
      </template>
      <template lwc:if={summaryStep}>
        <section class="card">
          <div class="row">
            <h2>Delivery address</h2>
            <button class="secondary" onclick={changeAddress}>
              Change address
            </button>
          </div>
          <p class="address">{snapshot}</p>
        </section>
        <section class="card">
          <h2>Your jewellery selection</h2>
          <template for:each={items} for:item="item"
            ><article class="product" key={item.lineId}>
              <img lwc:if={item.imageUrl} src={item.imageUrl} alt={item.name} />
              <div>
                <h2>{item.name}</h2>
                <p>
                  {item.quantity} &times;
                  <lightning-formatted-number
                    value={item.unitPrice}
                    format-style="currency"
                    currency-code="INR"
                  ></lightning-formatted-number>
                </p>
              </div>
              <lightning-formatted-number
                class="line-total"
                value={item.lineTotal}
                format-style="currency"
                currency-code="INR"
              ></lightning-formatted-number></article
          ></template>
          <p class="muted">No additional checkout charges are configured.</p>
          <div class="row">
            <p>Grand total</p>
            <strong class="amount"
              ><lightning-formatted-number
                value={total}
                format-style="currency"
                currency-code="INR"
              ></lightning-formatted-number
            ></strong>
          </div>
          <div class="actions">
            <a href={cartUrl}>Back to bag</a
            ><button onclick={continueToPayment}>Continue to payment</button>
          </div>
        </section>
      </template>
      <template lwc:if={paymentStep}>
        <section class="card">
          <p class="eyebrow">ORDER {orderNumber}</p>
          <h2>{resultTitle}</h2>
          <p class="amount">
            <lightning-formatted-number
              value={total}
              format-style="currency"
              currency-code="INR"
            ></lightning-formatted-number>
          </p>
          <p role="status">{message}</p>
          <p lwc:if={monitoring} role="status">{monitoringMessage}</p>
          <template lwc:if={paid}
            ><div class="actions">
              <a class="button" href={historyUrl}>View my orders</a
              ><a href={shoppingUrl}>Continue shopping</a>
            </div></template
          >
          <template lwc:else
            ><div class="actions">
              <button onclick={pay} disabled={payDisabled}>
                Pay now &middot; Test mode
              </button>
              <button
                lwc:if={hasPaymentUrl}
                class="secondary"
                onclick={openPayment}
              >
                Open Razorpay payment
              </button>
              <button class="secondary" onclick={refresh} disabled={busy}>
                Refresh status
              </button>
              <button
                class="secondary"
                onclick={retry}
                disabled={retryDisabled}
              >
                Retry payment
              </button>
              <button class="text-button" onclick={cancel} disabled={busy}>
                Cancel unpaid payment
              </button>
            </div>
            <p class="muted">
              Razorpay opens separately. New payment links allow two minutes
              from gateway creation. Expiry is confirmed by the gateway; closing
              this tab does not stop server reconciliation.
            </p></template
          >
          <div class="actions">
            <button class="secondary" onclick={backToSummary}>
              Back to order summary</button
            ><a href={shoppingUrl}>Continue shopping</a>
          </div>
        </section>
      </template>
    </template>
  </main>
</template>
