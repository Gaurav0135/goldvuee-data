<template>
  <main class="shell">
    <p class="eyebrow">GOLDVUEE &middot; YOUR SELECTION</p>
    <h1>Your shopping bag</h1>
    <a href={shoppingUrl}>Continue shopping</a>
    <template lwc:if={guest}>
      <section class="card">
        <h2>Keep something beautiful</h2>
        <p>Sign in to save and edit your jewellery selection.</p>
        <a class="button" href={loginUrl}>Sign in</a>
      </section>
    </template>
    <template lwc:else>
      <p class="error" role="alert">{error}</p>
      <p lwc:if={busy} role="status">Updating your bag...</p>
      <template lwc:if={hasItems}>
        <section class="card">
          <template for:each={rows} for:item="item">
            <article class="product" key={item.lineId}>
              <img lwc:if={item.imageUrl} src={item.imageUrl} alt={item.name} />
              <div>
                <h2>{item.name}</h2>
                <lightning-formatted-number
                  value={item.unitPrice}
                  format-style="currency"
                  currency-code="INR"
                ></lightning-formatted-number>
                <p lwc:if={item.available} class="muted">
                  Available in your selection
                </p>
                <p lwc:else class="error">
                  Check availability before checkout.
                </p>
                <div class="actions">
                  <button
                    class="secondary quantity"
                    data-id={item.lineId}
                    data-action="minus"
                    onclick={change}
                    disabled={item.decreaseDisabled}
                    aria-label="Decrease quantity"
                  >
                    -
                  </button>
                  <span>{item.quantity}</span>
                  <button
                    class="secondary quantity"
                    data-id={item.lineId}
                    data-action="plus"
                    onclick={change}
                    disabled={item.increaseDisabled}
                    aria-label="Increase quantity"
                  >
                    +
                  </button>
                  <button
                    class="text-button"
                    data-id={item.lineId}
                    data-action="remove"
                    onclick={change}
                    disabled={busy}
                  >
                    Remove
                  </button>
                </div>
              </div>
              <lightning-formatted-number
                class="line-total"
                value={item.lineTotal}
                format-style="currency"
                currency-code="INR"
              ></lightning-formatted-number>
            </article>
          </template>
          <div class="row">
            <p>{count} pieces &middot; Subtotal / total</p>
            <strong class="amount"
              ><lightning-formatted-number
                value={total}
                format-style="currency"
                currency-code="INR"
              ></lightning-formatted-number
            ></strong>
          </div>
          <a class="button" href={checkoutUrl}>Proceed to checkout</a>
        </section>
      </template>
      <template lwc:else
        ><section class="card">
          <h2>Your bag awaits something beautiful.</h2>
          <p>
            Explore jewellery made for your everyday and extraordinary moments.
          </p>
          <a class="button" href={shoppingUrl}>Explore collections</a>
        </section></template
      >
    </template>
  </main>
</template>
